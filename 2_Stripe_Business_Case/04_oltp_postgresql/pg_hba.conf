# Règles d'authentification de la base OLTP
# Connexions locales au conteneur : confiance (scripts d'initialisation, administration)
# Connexions réseau : chiffrement TLS obligatoire (hostssl) et mot de passe chiffré SCRAM-SHA-256
# Connexions réseau non chiffrées : rejetées explicitement (hostnossl ... reject)
# Réplication physique : réservée au rôle dédié "replicator", également chiffrée

# TYPE     DATABASE     USER        ADDRESS   METHOD
local      all          all                   trust
hostnossl  all          all         all       reject
hostssl    all          all         all       scram-sha-256
hostssl    replication  replicator  all       scram-sha-256
