# Surcharges locales :
# - monte tous les dossiers nécessaires (dont data/, src/, training/) dans les services Airflow ;
# - déclare la connexion Airflow vers la base fraud ;
# - scanne le dossier dags plus souvent (10 s) pour une détection rapide ;
# - corrige le démarrage de MLflow : prépare les droits du dossier de stockage, puis lance le serveur ;
# - ajoute le tableau de bord de monitoring (lecture de la base fraud).

x-mounts: &mounts
  - ./dags:/opt/airflow/dags
  - ./logs:/opt/airflow/logs
  - ./config:/opt/airflow/config
  - ./plugins:/opt/airflow/plugins
  - ./data:/opt/airflow/data
  - ./src:/opt/airflow/src
  - ./training:/opt/airflow/training

services:
  airflow-apiserver:
    volumes: *mounts
    environment:
      AIRFLOW_CONN_FRAUD_DB: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  airflow-scheduler:
    volumes: *mounts
    environment:
      AIRFLOW_CONN_FRAUD_DB: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  airflow-dag-processor:
    volumes: *mounts
    environment:
      AIRFLOW_CONN_FRAUD_DB: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  airflow-triggerer:
    volumes: *mounts
    environment:
      AIRFLOW_CONN_FRAUD_DB: postgresql://fraud:${FRAUD_DB_PASSWORD}@postgres:5432/fraud
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"

  mlflow:
    entrypoint: []
    user: "0:0"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    command:
      - bash
      - -c
      - |
        mkdir -p /mlflow/artifacts
        chown -R 50000:0 /mlflow/artifacts
        exec mlflow server \
          --host=0.0.0.0 \
          --port=5000 \
          --backend-store-uri=postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD}@postgres/mlflow \
          --artifacts-destination=/mlflow/artifacts \
          --serve-artifacts

  dashboard:
    build: ./dashboard
    environment:
      FRAUD_DB_HOST: postgres
      FRAUD_DB_PORT: "5432"
      FRAUD_DB_NAME: fraud
      FRAUD_DB_USER: fraud
      FRAUD_DB_PASSWORD: ${FRAUD_DB_PASSWORD}
    ports:
      - "127.0.0.1:8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
